name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Dendron
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and fix it quickly.
  - type: input
    id: version
    attributes:
      label: Dendron Version
      description: What version of Dendron are you running? (Run `python -c "import dendron; print(dendron.__version__)"`)
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version
      placeholder: e.g. macOS Sonoma / Python 3.11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Clear and concise explanation of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / Minimal Code Example
      description: A short, reproducible Python script showing the issue.
      render: python
      placeholder: |
        from dendron import Dendron, ToolDefinition

        # Minimal reproduction code here
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / Log Output
      description: Paste any error traceback or terminal logs here.
      render: shell
