[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendron-ai"
version = "0.1.0"
description = "Dendron: An adaptive, tree-based tool execution and dynamic discovery library for AI agents"
readme = "README.md"
authors = [{ name = "Sumanth Mallya", email = "sumanthmallya@gmail.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["dendron", "ai-agents", "mcp", "tree", "tools", "smart-tool", "llm", "rag", "agentic"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "langchain-core>=0.1.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
all = [
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sumanth1989/Dendron"
Documentation = "https://sumanth1989.github.io/Dendron"
Repository = "https://github.com/sumanth1989/Dendron.git"
Issues = "https://github.com/sumanth1989/Dendron/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dendron*"]

[tool.setuptools.package-data]
dendron = ["py.typed"]
